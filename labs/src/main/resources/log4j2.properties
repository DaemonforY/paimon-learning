# 默认只输出 WARN，Paimon 输出 INFO（能看到提交快照、合并等关键日志）
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %-5p [%c{1}] %m%n

# Flink 运行时的无害 WARN（如 UNION ALL 中有界 source 先结束时的 coordinator 告警）不打印
logger.flinkruntime.name = org.apache.flink.runtime
logger.flinkruntime.level = ERROR

logger.paimon.name = org.apache.paimon
logger.paimon.level = INFO

# 溢写临时目录的日志会打印本机临时路径，对实验没有帮助
logger.paimondisk.name = org.apache.paimon.disk
logger.paimondisk.level = WARN

# 想看合并选择原因时，把下面改成 DEBUG
logger.compact.name = org.apache.paimon.mergetree.compact
logger.compact.level = INFO

# remove_orphan_files 检查不存在的 index/、statistics/ 目录时打 WARN（含本机绝对路径），无害
logger.orphanclean.name = org.apache.paimon.flink.orphan.FlinkOrphanFilesClean
logger.orphanclean.level = ERROR
